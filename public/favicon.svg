<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2636"/>
      <stop offset="100%" stop-color="#0E121B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#3182F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="32" y1="10" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3182F6"/>
    </linearGradient>
    <linearGradient id="bowl" x1="32" y1="36" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE4F0"/>
    </linearGradient>
  </defs>

  <!-- Sleek dark obsidian squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Electric blue 4-point spark (deduction / insight) -->
  <path
    d="M32 10.5 C32 18.2 35.2 21.5 43 21.5 C35.2 21.5 32 24.8 32 32.5 C32 24.8 28.8 21.5 21 21.5 C28.8 21.5 32 18.2 32 10.5 Z"
    fill="url(#spark)"
  />

  <!-- Crisp minimalist white meal bowl -->
  <path
    d="M15 37.5 C15 36.1 16.1 35 17.5 35 H46.5 C47.9 35 49 36.1 49 37.5 C49 47.4 41.6 53 32 53 C22.4 53 15 47.4 15 37.5 Z"
